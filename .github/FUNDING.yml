# 赞助本项目

感谢你对课表 ICS 生成器的支持！

如果这个工具对你有帮助，可以通过以下方式支持我们：

## 贡献方式

### 💫 点 Star
如果你觉得这个项目有用，请给个 Star 支持一下！

### 🤝 提交代码
- 修复 Bug
- 实现新功能
- 改进文档

详见 [CONTRIBUTING.md](../../CONTRIBUTING.md)

### 📢 分享推荐
- 在 Twitter/微博 分享这个项目
- 推荐给你的朋友和同学
- 在你的博客中写评测

### 💬 提供反馈
- 报告问题和 Bug
- 建议改进
- 分享使用故事

## 赞助渠道（待开放）

目前项目还未启用赞助功能，但欢迎：
- ☕ 请开发者喝杯咖啡（微信支付/支付宝）
- 🎁 其他形式的支持

如果你有赞助意愿，请通过邮件或 Issue 联系我们！

---

**感谢所有做出贡献和支持的人！** ❤️
