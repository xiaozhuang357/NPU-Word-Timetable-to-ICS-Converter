name: 部署到 GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 检查文件完整性
        run: |
          echo "检查必要文件..."
          test -f index.html && echo "✅ index.html 存在"
          test -f README.md && echo "✅ README.md 存在"
          test -f LICENSE && echo "✅ LICENSE 存在"

      - name: 验证 HTML 和资源
        run: |
          echo "验证 HTML 语法..."
          if grep -q "<!DOCTYPE html>" index.html && grep -q "</html>" index.html; then
            echo "✅ HTML 结构正确"
          else
            echo "⚠️ HTML 结构可能有问题"
          fi

          echo "验证必要脚本..."
          if grep -q "mammoth" index.html; then
            echo "✅ mammoth.js 已包含"
          else
            echo "⚠️ mammoth.js 未找到"
          fi

      - name: 上传 artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: 部署完成通知
        if: success()
        run: echo "✅ GitHub Pages 部署完成！访问：https://${{ github.actor }}.github.io/ics/"
